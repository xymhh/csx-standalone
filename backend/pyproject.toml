[project]
name = "csx"
version = "0.1.0"
description = "CloudSubscribeX 独立版：网盘订阅、转存、整理与 STRM 生成"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "jinja2>=3.1",
    "requests>=2.32",
    "pysocks>=1.7",
    "curl_cffi>=0.7",
    "p115client",
    "p115oss",
    "urllib3-future",
    "cryptography>=43",
    "pycryptodome>=3.20",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "pillow>=10",
    "qrcode>=8",
    # 0.4+ 起安装即需 license key；0.3.19 用免 key 的 v146 二进制
    "cloakbrowser==0.3.19",
    "torf>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["csx*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["csx/vendor"]

[tool.ruff.format]
exclude = ["csx/vendor/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "UP046"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q -m 'not net'"
markers = ["net: real network smoke tests (excluded by default)"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 的 Depends 必须写在参数默认值里
"csx/api/**" = ["B008"]
# Preserve upstream vendor files byte-for-byte apart from approved import replacements.
"csx/vendor/**" = [
    "B010", "B904", "B905", "E731", "I001", "RUF005", "RUF007", "RUF010",
    "RUF012", "RUF013", "RUF022", "RUF023", "RUF046", "RUF059", "RUF100",
    "SIM102", "SIM103", "SIM117", "UP006", "UP007", "UP012", "UP017", "UP024",
    "UP035", "UP037", "UP042", "UP045",
]
